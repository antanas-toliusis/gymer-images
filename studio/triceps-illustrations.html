<style>
/* Layout: single reading column, reference plate up top, spec tables below, source last */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141516;--surface:#1d1f21;--ink:#ececea;--muted:#a3a6a9;--line:#323538;--accent:#f07a52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--surface:#1d1f21;--ink:#ececea;--muted:#a3a6a9;--line:#323538;--accent:#f07a52;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:40px}

.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

p{margin:0;max-width:65ch}
.lede{color:var(--muted);font-size:18px}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
.plate{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plate svg{display:block;width:100%;height:auto}

figcaption b{color:var(--ink);font-weight:600}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.no{color:var(--muted)}

th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 12px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg)}

td:first-child{font-weight:600;white-space:nowrap}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.note{font-size:15px;color:var(--muted);margin-top:10px}
.src-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.src-head h2{margin:0}
button{font:600 14px var(--body);color:var(--surface);background:var(--ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0;max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;font:12.5px/1.5 var(--mono);white-space:pre}
section{min-width:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-foot span{font-weight:600;font-size:15px;min-width:0}
.card-foot button{padding:6px 10px;font-size:13px;flex:none}

a{color:var(--accent)}
.count{font:600 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
</style>
